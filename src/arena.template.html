<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena das Árvores</title>
<!--FONTS--><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"><!--/FONTS-->
<style>
:root{
  --bg:#16151F; --stone:#23222F; --stone-2:#2E2C3D; --line:#45425A;
  --ink:#ECE3CF; --muted:#A9A1B8; --torch:#F2A93B; --ember:#E5604A; --moss:#7CC39A; --mana:#6FA8F2;
  --rb-red:#B4363A; --rb-black:#0C0B12;
  --oA:#F2A93B; --oB:#E5604A; --oC:#6FA8F2; --oD:#7CC39A;
  --display:'IM Fell English SC', Georgia, serif;
  --body:'Alegreya Sans', 'Trebuchet MS', Verdana, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  background-image:radial-gradient(1200px 500px at 30% -10%, #2a2440 0%, transparent 60%);background-attachment:fixed}
button,input,select{font-family:var(--body);font-size:17px;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--torch);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1300px;margin:0 auto;padding:16px 18px 28px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;margin-bottom:14px}
.brand{flex:1;min-width:220px}
.brand small{display:block;color:var(--torch);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.brand h1{font-family:var(--display);font-weight:400;font-size:32px;margin:0;line-height:1.05}
.pill{background:var(--stone);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.pill b{color:var(--ink)}
.pill.live{border-color:var(--moss);color:var(--moss)}
.card{background:var(--stone);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 8px;line-height:1.1}
.card h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 8px}
.muted{color:var(--muted)}
.btn{background:var(--stone-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--torch)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--torch);color:#1d1408;border-color:var(--torch)}
.btn.big{font-size:20px;padding:14px 28px}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.mode{display:flex;flex-direction:column;gap:10px}
.mode p{margin:0}
.field{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.field > span{font-size:14px;color:var(--muted)}
select,input[type=text]{background:var(--stone-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:inline-flex;gap:7px;align-items:center;font-size:16px;cursor:pointer}
.checks input{accent-color:var(--torch);width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--stone-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:16px}
.chip.me{border-color:var(--torch);color:var(--torch)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.teams input{width:100%}

/* pergunta */
.qhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:10px}
.qhead .num{font-family:var(--display);font-size:24px}
.timer{flex:1;min-width:160px;height:14px;border-radius:7px;background:var(--stone);border:1px solid var(--line);overflow:hidden}
.timer span{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--torch));transition:width .25s linear}
.secs{font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.qbody{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.prompt{font-family:var(--display);font-size:clamp(26px,3vw,38px);line-height:1.12;margin:0 0 12px;text-wrap:balance}
.treebox{background:#121119;border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;justify-content:center;align-items:center;min-height:220px}
.treebox svg{max-width:100%;height:auto;display:block}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{position:relative;border:none;border-radius:14px;padding:16px 16px 16px 58px;text-align:left;font-weight:800;font-size:clamp(18px,2vw,24px);color:#17120A;min-height:84px;display:flex;align-items:center;overflow:hidden}
.opt .shape{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:grid;place-items:center}
.opt .shape svg{width:30px;height:30px}
.opt .count{margin-left:auto;padding-left:10px;font-size:26px;font-variant-numeric:tabular-nums}
.opt .fill{position:absolute;left:0;bottom:0;height:6px;background:rgba(0,0,0,.35)}
.oA{background:var(--oA)} .oB{background:var(--oB)} .oC{background:var(--oC)} .oD{background:var(--oD)}
.opt.dim{opacity:.28}
.opt.right{outline:4px solid var(--ink);outline-offset:3px}
.opt.right::after{content:"✓";position:absolute;right:12px;top:6px;font-size:22px}
.hintbox{margin-top:12px;background:var(--stone-2);border:1px dashed var(--torch);border-radius:10px;padding:10px 14px;font-size:17px}
.hintbox b{display:block;color:var(--torch);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.explain{margin-top:12px;background:var(--stone-2);border:1px solid var(--line);border-left:5px solid var(--moss);border-radius:10px;padding:10px 14px;font-size:17px}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.board li{display:grid;grid-template-columns:46px 1fr auto auto;gap:12px;align-items:center;background:var(--stone-2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:20px}
.board .pos{font-family:var(--display);font-size:24px;color:var(--torch)}
.board .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .gain{color:var(--moss);font-weight:700;font-size:16px}
.board .pts{font-weight:800;font-variant-numeric:tabular-nums}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:16px 0 22px}
.podium div{width:min(200px,30vw);border-radius:12px 12px 0 0;background:var(--stone-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 8px;text-align:center}
.podium .p1{height:220px;border-color:var(--torch)} .podium .p2{height:170px} .podium .p3{height:130px}
.podium b{font-family:var(--display);font-size:34px;color:var(--torch)}
.podium .n{font-weight:800;font-size:20px;word-break:break-word}
.teambtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.tb{border:2px solid var(--line);background:var(--stone-2);border-radius:10px;padding:10px 16px;font-weight:800}
.tb[aria-pressed="true"]{border-color:var(--moss);background:#284634}

/* aluno */
.student{max-width:560px;margin:0 auto}
.sopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.sopts .opt{min-height:120px;padding:14px 12px 14px 52px;font-size:19px}
.sopts .opt:disabled{cursor:default}
.sopts .opt.mine{outline:4px solid var(--ink);outline-offset:3px}
.result{text-align:center;padding:22px 16px}
.result .big{font-family:var(--display);font-size:44px;line-height:1}
.result.ok .big{color:var(--moss)} .result.no .big{color:var(--ember)}
.center{text-align:center}

@media (max-width:860px){ .qbody{grid-template-columns:1fr} .modes{grid-template-columns:1fr} .grid2{grid-template-columns:1fr} }
@media (max-width:520px){ .opts{grid-template-columns:1fr} .opt{min-height:64px} .board li{font-size:17px;grid-template-columns:34px 1fr auto} .board .gain{display:none} }
@media (prefers-reduced-motion: reduce){ .timer span{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><small>Masmorra ao vivo · Era 03</small><h1>Arena das Árvores</h1></div>
    <span class="pill" id="connPill">Só neste aparelho</span>
    <span class="pill" id="countPill" hidden></span>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

<script>
/*ENGINE*/
</script>
<script>
(function(){
'use strict';
var E = Engine, $ = function(id){ return document.getElementById(id); };
var app = $('app');
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function rnd(n){ return Math.floor(Math.random() * n); }
function pick(a){ return a[rnd(a.length)]; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
var LET = ['A', 'B', 'C', 'D'], OCL = ['oA', 'oB', 'oC', 'oD'];
var SHAPES = [
  '<svg viewBox="0 0 30 30"><path d="M15 3 L28 26 H2 Z" fill="#17120A"/></svg>',
  '<svg viewBox="0 0 30 30"><path d="M15 2 L28 15 L15 28 L2 15 Z" fill="#17120A"/></svg>',
  '<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="#17120A"/></svg>',
  '<svg viewBox="0 0 30 30"><rect x="4" y="4" width="22" height="22" rx="2" fill="#17120A"/></svg>'
];

/* ================= perguntas ================= */
function pre(t){ var out = []; (function w(n){ if (!n) return; out.push(n.key); w(n.left); w(n.right); })(t.root); return out; }
function cols(t){ var s = ''; (function w(n){ if (!n) return; s += n.color === 'R' ? 'R' : 'B'; w(n.left); w(n.right); })(t.root); return s; }
function dirW(d){ return d === 'L' ? 'esquerda' : 'direita'; }
function fb(b){ return (b > 0 ? '+' : b < 0 ? '−' : '') + Math.abs(b); }
function randBST(n, maxH){ for (var i = 0; i < 300; i++) { var t = { root:null }, ks = []; while (ks.length < n) { var k = 3 + rnd(95); if (ks.indexOf(k) < 0) ks.push(k); } ks.forEach(function(k){ E.bstInsert(t, k); }); if (E.height(t.root) <= maxH && E.height(t.root) >= 3) return t; } return t; }
function why(q){ return !q.hints ? [q.explain] : q.topic === 'trav' ? [q.explain, q.hints[1]] : [q.hints[1]]; }
function finish(q, opts, correctText){
  // embaralha mantendo a certa
  var o = shuffle(opts); q.opts = o; q.correct = o.indexOf(correctText); return q;
}
var GEN = {
  insert: function(){
    var ch = E.genBST(2 + rnd(3)), t = ch.tree, slots = [];
    E.nodes(t).forEach(function(n){ if (!n.left) slots.push('à esquerda de ' + n.key); if (!n.right) slots.push('à direita de ' + n.key); });
    var right = 'à ' + (ch.answer.side === 'L' ? 'esquerda' : 'direita') + ' de ' + ch.answer.parent;
    var others = shuffle(slots.filter(function(s){ return s !== right; })).slice(0, 3);
    var path = E.insertPath(t, ch.key).map(function(s){ return (ch.key < s.node.key ? '< ' : '> ') + s.node.key + ' → ' + dirW(s.dir); });
    return finish({ topic:'bst', prompt:'Onde a chave ' + ch.key + ' entra?', tree:{ pre: pre(t) }, hints: Hints.insert(t, ch.key), explain: ch.key + ': ' + path.join(' · ') + '.' }, others.concat([right]), right);
  },
  search: function(){
    var t = randBST(8, 5), n = pick(E.nodes(t).filter(function(x){ return E.depth(x) >= 1; })), c = E.depth(n) + 1;
    var set = [c]; [c - 1, c + 1, c + 2, c - 2].forEach(function(v){ if (v >= 1 && set.length < 4 && set.indexOf(v) < 0) set.push(v); });
    var path = []; var m = n; while (m) { path.unshift(m.key); m = m.parent; }
    return finish({ topic:'bst', prompt:'Quantas salas a busca por ' + n.key + ' visita, contando a raiz?', tree:{ pre: pre(t) }, hints: Hints.search(t, n.key), explain:'Caminho: ' + path.join(' → ') + ' = ' + c + ' comparações.' }, set.map(String), String(c));
  },
  trav: function(){
    var t, a, b, c, d;
    for (var i = 0; i < 100; i++) {
      t = randBST(6, 4);
      a = pre(t).join(' ');
      var ino = [], po = [], lv = []; (function w(n){ if (!n) return; w(n.left); ino.push(n.key); w(n.right); })(t.root); (function w(n){ if (!n) return; w(n.left); w(n.right); po.push(n.key); })(t.root);
      var qq = [t.root]; while (qq.length) { var x = qq.shift(); lv.push(x.key); if (x.left) qq.push(x.left); if (x.right) qq.push(x.right); }
      b = ino.join(' '); c = po.join(' '); d = lv.join(' ');
      if (a !== d && a !== c && b !== c && c !== d) break;
    }
    var which = pick([['pré-ordem', a, 'raiz, depois esquerda, depois direita'], ['em ordem', b, 'esquerda, raiz, direita: sai ordenado'], ['pós-ordem', c, 'esquerda, direita e só então a raiz']]);

  },
  avlCase: function(){
    var ch = E.genAVL(pick(['LL', 'RR', 'LR', 'RL']), 2), z = E.find(ch.tree, ch.answer.z), cs = ch.answer.cs, child = cs[0] === 'L' ? z.left : z.right;
    var marks = {}; marks[z.key] = 'bad'; marks[ch.key] = 'fresh';
    var q = { topic:'avl', prompt:'A chave ' + ch.key + ' desequilibrou a sala ' + z.key + '. Qual rotação resolve?', tree:{ pre: pre(ch.tree), marks: marks, bf: [z.key] }, hints: Hints.avl(ch.tree, z.key, ch.key, false),
      explain:'fb(' + z.key + ') = ' + fb(E.bf(z)) + ': pesa à ' + (cs[0] === 'L' ? 'esquerda' : 'direita') + '. ' + ch.key + ' entrou à ' + (cs[1] === 'L' ? 'esquerda' : 'direita') + ' do filho ' + child.key + ': caso ' + cs + '.' };
    q.opts = ['LL', 'RR', 'LR', 'RL']; q.correct = q.opts.indexOf(cs); return q;
  },
  avlNode: function(){
    var ch = E.genAVL(null, 3), z = ch.answer.z, path = [], n = E.find(ch.tree, ch.key).parent;
    while (n) { if (n.key !== z) path.push(n.key); n = n.parent; }
    var pool = shuffle(path).concat(shuffle(E.keys(ch.tree).filter(function(k){ return k !== z && k !== ch.key && path.indexOf(k) < 0; })));
    var marks = {}; marks[ch.key] = 'fresh';
    var zn = E.find(ch.tree, z);
    return finish({ topic:'avl', prompt:'A chave ' + ch.key + ' acabou de entrar na AVL. Qual a sala desequilibrada mais baixa?', tree:{ pre: pre(ch.tree), marks: marks }, hints: Hints.avlFind(ch.tree, ch.key),
      explain:'Subindo de ' + ch.key + ', a primeira sala com |fb| ≥ 2 é ' + z + ' (fb ' + fb(E.bf(zn)) + ').' }, pool.slice(0, 3).map(String).concat([String(z)]), String(z));
  },
  rb: function(){
    var ch = E.genRB(pick(['recolor', 'single', 'double', 'single', 'double', 'ok']), 2), t = ch.tree, x = E.find(t, ch.key), r = E.rbRoles(t, x), d = ch.seq[0];
    var NAMES = { ok:'Nada a fazer', recolor:'Recolorir P, T e A', single:'Rotação simples no avô', double:'Rotação dupla', root:'Pintar a raiz de preto' };
    var badges = {}; badges[x.key] = 'X'; if (r.p) badges[r.p.key] = 'P'; if (r.g) badges[r.g.key] = 'A'; if (r.u) badges[r.u.key] = 'T';
    var nil = !r.u && r.g ? { g: r.g.key, side: r.uSide } : null;
    var why = { ok:'O pai é preto: nenhuma regra foi quebrada.', recolor:'Pai e tio vermelhos: recolore e o conflito sobe para o avô.',
      single:'Tio preto (ou NIL) e X, P, A em linha reta: rotação simples no avô.', double:'Tio preto (ou NIL) e X, P, A em zigue-zague: rotação dupla.' }[d];
    var others = shuffle(['ok', 'recolor', 'single', 'double', 'root'].filter(function(a){ return a !== d; })).slice(0, 3);
    return finish({ topic:'rb', hints: Hints.rb(t, x), prompt:'A chave ' + ch.key + ' entrou vermelha. Qual o próximo passo?', tree:{ pre: pre(t), col: cols(t), badges: badges, nil: nil, marks: (function(){ var m = {}; m[x.key] = 'cur'; return m; })() }, explain: why },
      others.map(function(a){ return NAMES[a]; }).concat([NAMES[d]]), NAMES[d]);
  },
  splay: function(){
    var ch = E.genSplay(null, 2), t = ch.tree, x = E.find(t, ch.key), d = ch.seq[0], p = x.parent;
    var badges = {}; badges[x.key] = 'X'; badges[p.key] = 'P'; if (p.parent) badges[p.parent.key] = 'A';
    var N = { zig:'Zig', zigzig:'Zig-zig', zigzag:'Zig-zag' };
    var why = { zig:'O pai é a raiz: um Zig basta.', zigzig:'X e o pai são filhos do mesmo lado: Zig-zig.', zigzag:'X e o pai estão em lados opostos: Zig-zag.' }[d];
    var m = {}; m[x.key] = 'cur';
    var q = { topic:'splay', prompt:'Primeiro passo para levar ' + ch.key + ' até a raiz da splay?', tree:{ pre: pre(t), badges: badges, marks: m }, explain: why, hints: Hints.splay(x) };
    q.opts = ['Zig', 'Zig-zig', 'Zig-zag']; q.correct = q.opts.indexOf(N[d]); return q;
  }
};
var TOPIC_GENS = { bst:['insert', 'search'], trav:['trav'], avl:['avlCase', 'avlNode'], rb:['rb'], splay:['splay'] };
var TOPIC_NAMES = { bst:'Busca e inserção (BST)', trav:'Percursos', avl:'AVL', rb:'Rubro-negra', splay:'Splay' };
function makeQuiz(n, topics){
  var gens = []; topics.forEach(function(t){ gens = gens.concat(TOPIC_GENS[t]); });
  var out = [], last = null;
  for (var i = 0; i < n; i++) { var g; do { g = pick(gens); } while (gens.length > 1 && g === last); last = g; out.push(GEN[g]()); }
  return out;
}

/* ================= desenho da árvore ================= */
function treeSVG(spec, maxW){
  var t = { root:null }; spec.pre.forEach(function(k, i){ var x = E.bstInsert(t, k); x.color = spec.col ? (spec.col[i] === 'R' ? 'R' : 'B') : null; });

  (function w(n, d){ if (!n) return; w(n.left, d + 1); i++; pos[n.key] = { x: PAD + i * DX, y: PAD + NH / 2 + d * DY }; if (d > maxD) maxD = d; w(n.right, d + 1); })(t.root, 0);
  var W = PAD * 2 + (i + 1) * DX, H = PAD * 2 + NH + maxD * DY + (spec.nil ? 30 : 6);
  var s = '', marks = spec.marks || {}, badges = spec.badges || {}, bfs = spec.bf || [];
  E.nodes(t).forEach(function(n){ if (n.parent) { var a = pos[n.parent.key], b = pos[n.key]; s += '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="#5B5674" stroke-width="3"/>'; } });
  if (spec.nil) { var g = pos[spec.nil.g]; if (g) { var nx = g.x + (spec.nil.side === 'L' ? -DX / 2 : DX / 2), ny = g.y + DY * 0.72;
    s += '<line x1="' + g.x + '" y1="' + (g.y + NH / 2) + '" x2="' + nx + '" y2="' + (ny - 10) + '" stroke="#8a6a35" stroke-width="2" stroke-dasharray="4 4"/><rect x="' + (nx - 16) + '" y="' + (ny - 10) + '" width="32" height="20" rx="4" fill="#0C0B12" stroke="#8C87A6"/><text x="' + nx + '" y="' + ny + '" fill="#A9A1B8" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central">NIL</text>' + badgeSVG(nx + 16, ny - 10, 'T'); } }
  E.nodes(t).forEach(function(n){
    var p = pos[n.key], fill = '#23222F', stroke = '#45425A', sw = 2;
    if (n.color === 'R') { fill = '#B4363A'; stroke = '#F08A86'; } else if (n.color === 'B') { fill = '#0C0B12'; stroke = '#8C87A6'; }
    if (marks[n.key] === 'fresh') { stroke = '#7CC39A'; sw = 4; }
    if (marks[n.key] === 'bad') { stroke = '#E5604A'; sw = 4; }
    if (marks[n.key] === 'cur') { stroke = '#F2A93B'; sw = 4; }

  if (T.phase === 'end') {
    var rk2 = ranking(), top = rk2.slice(0, 3);
    var pod = [top[1], top[0], top[2]].map(function(r, i){ var cls = ['p2', 'p1', 'p3'][i]; return r ? '<div class="' + cls + '"><b>' + r.rank + 'º</b><span class="n">' + esc(r.name) + '</span><span class="muted">' + r.score.toLocaleString('pt-BR') + '</span></div>' : '<div class="' + cls + '" style="visibility:hidden"></div>'; }).join('');
    app.innerHTML = '<div class="card center"><h2>Fim da batalha</h2><div class="podium">' + pod + '</div>' +
      '<ol class="board" style="text-align:left">' + rk2.slice(3, 15).map(function(r){ return '<li><span class="pos">' + r.rank + 'º</span><span class="nm">' + esc(r.name) + '</span><span class="gain"></span><span class="pts">' + r.score.toLocaleString('pt-BR') + '</span></li>'; }).join('') + '</ol>' +
      '<div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary big" id="again">Nova partida</button></div></div>';
    $('again').addEventListener('click', function(){ var m = T.mode; T = null; render(); });
  }
}
function renderStudent(){
  if (!S || !S.joined) {
    var nick = ''; try { nick = localStorage.getItem('arena-nick') || ''; } catch (e) {}
    app.innerHTML = '<div class="student card"><h2>Entrar na arena</h2><p class="muted">Escolha um apelido. Ele aparece no telão para a turma toda.</p>' +
      '<form id="joinForm" class="row"><input type="text" id="nick" maxlength="18" autocomplete="off" placeholder="Seu apelido" value="' + esc(nick) + '" style="flex:1;min-width:0;font-size:20px"><button class="btn primary big">Entrar</button></form></div>';
    $('joinForm').addEventListener('submit', function(e){ e.preventDefault(); join($('nick').value); });
    $('nick').focus();
    return;
  }
  var st = S.st;
  if (!st || st.phase === 'lobby') {
    app.innerHTML = '<div class="student card center"><h2>Você está na arena</h2><p style="font-size:28px;font-weight:800;margin:6px 0">' + esc(S.nick) + '</p><p class="muted">' + (st ? 'Aguardando o professor começar.' : 'Aguardando o professor abrir a sala.') + '</p></div>';
    return;
  }
  var k = st.epoch + ':' + st.i;
  if (st.phase === 'question') {
    if (Hints.isOpen()) Hints.close(true);
    var mine = S.answered[k];
    var h = '<div class="student"><div class="qhead"><span class="num">' + (st.i + 1) + '/' + st.n + '</span><div class="timer"><span id="sbar"></span></div><span class="secs" id="ssec"></span></div>' +
      '<p class="prompt" style="font-size:24px">' + esc(st.q.prompt) + '</p><div class="treebox">' + treeSVG(st.q.tree, 520) + '</div><div class="sopts">';
    st.q.opts.forEach(function(o, i){ h += optHTML(o, i, mine === undefined ? '' : (mine === i ? 'mine' : 'dim'), 'button') + '</button>'; });
    var lv = Math.max((S.hints && S.hints[k]) || 0, st.hint || 0), pen = Math.max(0, ((S.hints && S.hints[k]) || 0) - (st.hint || 0));
    h += '</div>';
    if (lv && st.q.hints) h += '<div class="hintbox"><b>Dica ' + lv + ' de 2' + (pen ? ' · vale ' + (100 - 25 * pen) + '% dos pontos' : ' · liberada pelo professor') + '</b>' + esc(st.q.hints[lv - 1]) + '</div>';
    if (mine === undefined && lv < 2 && st.q.hints) h += '<div class="row" style="margin-top:12px;justify-content:center"><button class="btn" id="shint">Dica ' + (lv + 1) + ' de 2 · −25% dos pontos</button></div>';
    h += (mine !== undefined ? '<p class="center muted" style="margin-top:12px">Resposta enviada. Espere a revelação.</p>' : '') + '</div>';
    app.innerHTML = h;
    [].forEach.call(document.querySelectorAll('.sopts .opt'), function(b){ b.disabled = mine !== undefined; b.addEventListener('click', function(){ answer(+b.dataset.i); }); });
    if ($('shint')) $('shint').addEventListener('click', studentHint);
    updateStudentTimer(); return;
  }
  if (st.phase === 'reveal' || st.phase === 'end') {
    var r = S.res[k], my = S.answered[k], ok = my === st.correct;
    var h2 = '<div class="student card">';
    if (st.phase === 'reveal') {
      h2 += '<div class="result ' + (my === undefined ? 'no' : ok ? 'ok' : 'no') + '"><div class="big">' + (my === undefined ? 'Sem resposta' : ok ? 'Acertou!' : 'Errou') + '</div>' +
        (r ? '<p style="font-size:22px;font-weight:800;margin:10px 0 0">' + (r.gain ? '+' + r.gain + ' · ' : '') + r.score.toLocaleString('pt-BR') + ' pontos</p><p class="muted" style="margin:4px 0 0">' + r.rank + 'º de ' + r.of + '</p>' : '') + '</div>' +
        '<p style="margin:0 0 6px"><b>Certa:</b> ' + esc(st.q.opts[st.correct]) + '</p><div class="explain">' + why({ topic: st.q.topic, hints: st.q.hints, explain: st.explain || '' }).map(esc).join('<br>') + '</div>';
    } else {
      var fr = null; Object.keys(S.res).forEach(function(kk){ if (kk.indexOf(st.epoch + ':') === 0) fr = S.res[kk]; });
      h2 += '<div class="result ok"><div class="big">Fim da batalha</div>' + (fr ? '<p style="font-size:30px;font-weight:800;margin:10px 0 0">' + fr.rank + 'º lugar</p><p class="muted">' + fr.score.toLocaleString('pt-BR') + ' pontos</p>' : '') + '</div>';
      if (st.board) h2 += '<ol class="board">' + st.board.slice(0, 5).map(function(b, i){ return '<li><span class="pos">' + (i + 1) + 'º</span><span class="nm">' + esc(b[0]) + '</span><span class="pts">' + (+b[1]).toLocaleString('pt-BR') + '</span></li>'; }).join('') + '</ol>';
    }
    app.innerHTML = h2 + '</div>';
    if (st.phase === 'reveal' && !ok) { S.shown = S.shown || {}; if (!S.shown[k]) { S.shown[k] = 1; Hints.modal({ title:'Resposta certa: ' + st.q.opts[st.correct], kicker: my === undefined ? 'Sem resposta' : 'Você marcou: ' + st.q.opts[my], lines: why({ topic: st.q.topic, hints: st.q.hints, explain: st.explain || '' }), svgs:[{ label:'Árvore da pergunta', svg: treeSVG(st.q.tree, 520) }] }); } }
  }
}

render();
connectRoom();
window.__arena = { get T(){ return T; }, get S(){ return S; }, GEN: GEN, makeQuiz: makeQuiz };
})();
</script>
